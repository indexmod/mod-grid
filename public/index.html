<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>GRID</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%239B5CFF'/%3E%3C/svg%3E">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="/index.css">

<style>
  /* минимальный reset чтобы не ломало drag */
  html, body {
    margin: 0;
    padding: 0;
    background: #111214;
    color: #e6e6e6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    overflow-x: hidden;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 10;

    background: #111214;
    padding: 12px 16px;

    display: flex;
    justify-content: flex-start;
    gap: 10px;

    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  #addBtn {
    background: #1a1b1e;
    color: #b8b8b8;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  #addBtn:hover {
    border-color: #9b5cff;
    color: #9b5cff;
  }

  #grid {
    display: flex;
    flex-direction: column;
    gap: 16px;

    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }
</style>

</head>

<body>

<div id="topbar">
  <button id="addBtn">+ new</button>
</div>

<div id="grid"></div>

<script src="/index.js" defer></script>

</body>
</html>
